name: Crow release draft

on:
  workflow_run:
    workflows:
      - Crow asset validation
    types:
      - completed
    branches:
      - main

concurrency:
  group: crow-release-draft-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APM_INSTALLER_URL: https://raw.githubusercontent.com/microsoft/apm/a4fb4283c53fbef75078f38e017f430c3dbe1aea/install.sh
  APM_INSTALLER_SHA256: fac1b4e1bd306b057e72af24608d1773afade2fbcd5e8466790c03e460d24ef5

jobs:
  check_release_changes:
    name: Check release-relevant changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_release_changes: ${{ steps.changes.outputs.has_release_changes }}

    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect release-relevant changes
        id: changes
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $parentSha = git rev-parse "$env:COMMIT_SHA^" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $changedFiles = @(git diff --name-only $parentSha $env:COMMIT_SHA)
          }
          else {
            $changedFiles = @(git ls-tree --name-only -r $env:COMMIT_SHA)
          }

          $releaseFiles = @(
            $changedFiles | Where-Object {
              $_ -eq 'apm.yml' -or $_ -like '.apm/*'
            }
          )
          $hasReleaseChanges = $releaseFiles.Count -gt 0

          if ($hasReleaseChanges) {
            Write-Host 'Release-relevant changes detected:'
            $releaseFiles | ForEach-Object { Write-Host "- $_" }
          }
          else {
            Write-Host 'No release-relevant changes detected.'
          }

          "has_release_changes=$($hasReleaseChanges.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  prepare:
    name: Prepare release candidate
    needs: check_release_changes
    if: >-
      needs.check_release_changes.result == 'success' &&
      needs.check_release_changes.outputs.has_release_changes == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit_sha: ${{ steps.context.outputs.commit_sha }}
      notes_path: ${{ steps.notes.outputs.path }}

    steps:
      - name: Resolve approved source
        id: context
        shell: pwsh
        env:
          VALIDATED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $commitSha = $env:VALIDATED_COMMIT_SHA
          if ($commitSha -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'The source commit must be a full 40-character SHA.'
          }
          "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT

      - name: Check out exact main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.context.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content ./apm.yml | Select-String '^version:' | ForEach-Object { $_.Line -replace '^version:\s*', '' }).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid package version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Locate reviewed release notes
        id: notes
        shell: pwsh
        run: |
          $path = ".github/release-notes/v${{ steps.version.outputs.version }}.md"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Reviewed release notes are required at $path. Ask Copilot or a maintainer to author and review them from the complete release diff."
          }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Install APM
        shell: bash
        run: |
          installer="$RUNNER_TEMP/apm-install.sh"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$installer" "$APM_INSTALLER_URL"
          echo "$APM_INSTALLER_SHA256  $installer" | sha256sum --check --strict
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.apm/bin" >> "$GITHUB_PATH"

      - name: Verify APM
        shell: pwsh
        run: |
          if ($null -eq (Get-Command apm -ErrorAction SilentlyContinue)) {
            throw 'APM was not installed.'
          }

      - name: Prepare candidate
        shell: pwsh
        run: |
          & ./.apm/skills/crow-release/scripts/New-CrowReleaseDraft.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -CommitSha '${{ steps.context.outputs.commit_sha }}' `
            -ReleaseNotesPath '${{ steps.notes.outputs.path }}' `
            -OutputDirectory ./build/crow-release-candidate `
            -PrepareOnly

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: crow-release-candidate-${{ steps.version.outputs.version }}
          path: build/crow-release-candidate
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create approved draft release
    needs:
      - check_release_changes
      - prepare
    if: >-
      needs.check_release_changes.outputs.has_release_changes == 'true' &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out exact approved commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate metadata
        uses: actions/download-artifact@v5
        with:
          name: crow-release-candidate-${{ needs.prepare.outputs.version }}
          path: build/crow-release-candidate

      - name: Install APM
        shell: bash
        run: |
          installer="$RUNNER_TEMP/apm-install.sh"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$installer" "$APM_INSTALLER_URL"
          echo "$APM_INSTALLER_SHA256  $installer" | sha256sum --check --strict
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.apm/bin" >> "$GITHUB_PATH"

      - name: Create and verify draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $tokenBytes = [System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          $encodedToken = [Convert]::ToBase64String($tokenBytes)
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $encodedToken"
          & ./.apm/skills/crow-release/scripts/New-CrowReleaseDraft.ps1 `
            -Version '${{ needs.prepare.outputs.version }}' `
            -CommitSha '${{ needs.prepare.outputs.commit_sha }}' `
            -Repository '${{ github.repository }}' `
            -CandidateDirectory ./build/crow-release-candidate
