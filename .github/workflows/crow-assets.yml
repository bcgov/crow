name: Crow asset validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release_version:
    name: Check PR release version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require version bump for release changes
        shell: pwsh
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          & ./.apm/skills/crow-release/scripts/Test-CrowPullRequestVersion.ps1 -BaseCommit $env:BASE_COMMIT

  validate:
    name: Validate Crow assets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run deterministic asset checks
        shell: pwsh
        run: |
          & .\.apm\skills\crow-agent-skill-authoring\scripts\Test-CrowAssets.ps1 -StrictContext

      - name: Test agent and skill dependency graph
        shell: pwsh
        run: |
          & .\.apm\skills\crow-agent-skill-authoring\scripts\Test-CrowAssetDependencyGraph.Tests.ps1

      - name: Test security remediation scope aliases
        shell: pwsh
        run: |
          & .\.apm\skills\crow-agent-skill-authoring\scripts\Test-CrowSecurityRemediationScopes.Tests.ps1

      - name: Test Raven setup CLI
        shell: pwsh
        run: |
          node --test .\.apm\skills\crow-raven-setup\scripts\crow-raven-setup.test.mjs

      - name: Validate public Crow project memory
        shell: pwsh
        run: |
          & .\.apm\skills\crow-project-context\scripts\Test-CrowConfig.ps1
          & .\.apm\skills\crow-project-context\scripts\Test-CrowConfig.Tests.ps1

      - name: Test Crow debt scanner
        shell: pwsh
        run: |
          & .\.apm\skills\crow-simplification-review\scripts\Test-CrowDebt.Tests.ps1

      - name: Test architecture output validation
        shell: pwsh
        run: |
          & .\.apm\skills\crow-architecture-review\scripts\Test-ArchitectureOutput.Tests.ps1

      - name: Test security review synthesis
        shell: pwsh
        run: |
          & .\.apm\skills\crow-security-review\scripts\New-CrowSecuritySynthesis.Tests.ps1

      - name: Test executive report rendering
        shell: pwsh
        run: |
          & .\.apm\skills\crow-executive-report\Test-ExecutiveReportOutput.Tests.ps1

      - name: Test executive report STRIDE data contract
        shell: pwsh
        run: |
          & .\.apm\skills\crow-executive-report\Test-CrowExecutiveReportStride.Tests.ps1

      - name: Test solution architecture output validation
        shell: pwsh
        run: |
          & .\.apm\skills\crow-solution-architecture\scripts\Test-SolutionArchitectureOutput.Tests.ps1
          node --test .\.apm\skills\crow-solution-architecture\scripts\technology-preferences.test.mjs

      - name: Test business rule validation and rendering
        shell: pwsh
        run: |
          & .\.apm\skills\crow-business-rules\scripts\Test-CrowBusinessRules.Tests.ps1

      - name: Test release safety guards
        shell: pwsh
        run: |
          & .\.apm\skills\crow-release\scripts\Test-CrowReleaseGuards.ps1
          & .\.apm\skills\crow-release\scripts\Test-CrowPullRequestVersion.Tests.ps1

      - name: Test release draft preparation
        shell: pwsh
        run: |
          & .\.apm\skills\crow-release\scripts\Test-NewCrowReleaseDraft.Tests.ps1

      - name: Test testing-template synchronization
        shell: pwsh
        run: |
          & .\.apm\skills\crow-testing\scripts\Test-CrowTestingTemplateSync.ps1

      - name: Test API modernization coverage gate
        shell: pwsh
        run: |
          & .\.apm\skills\crow-testing\scripts\Test-ApiModernizationCoverage.Tests.ps1
